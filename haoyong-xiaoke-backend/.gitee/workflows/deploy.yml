# ============================================
# Gitee Go CI/CD 流水线配置
# ============================================
# 触发条件：打 Tag 发布（如 v1.0.0）
# 功能：自动构建、测试、部署到腾讯云服务器
# ============================================

name: Build & Deploy

on:
  push:
    tags:
      - 'v*.*.*'  # 匹配 v1.0.0, v1.0.1 等格式

env:
  APP_NAME: xiaoke-api
  SERVER_HOST: 106.54.59.191
  SERVER_USER: root
  SERVER_PATH: /www/wwwroot/xiaoke-backend

stages:
  - build
  - test
  - deploy

# ============================================
# Stage 1: 安装依赖
# ============================================
install_dependencies:
  stage: build
  image: node:20-alpine
  cache:
    key: npm-cache-${{ runner.os }}
    paths:
      - node_modules/
  script:
    - echo "📦 安装依赖..."
    - npm ci --prefer-offline
    - echo "✅ 依赖安装完成"

# ============================================
# Stage 2: 构建项目
# ============================================
build_project:
  stage: build
  image: node:20-alpine
  needs:
    - install_dependencies
  cache:
    key: npm-cache-${{ runner.os }}
    paths:
      - node_modules/
  script:
    - echo "🔨 构建项目..."
    - npx prisma generate
    - npm run build
    - echo "✅ 构建完成"
  artifacts:
    name: dist
    paths:
      - dist/
      - node_modules/
      - package.json
      - prisma/
      - .env
    expire_in: 1 hour

# ============================================
# Stage 3: 运行测试
# ============================================
run_tests:
  stage: test
  image: node:20-alpine
  needs:
    - build_project
  script:
    - echo "🧪 运行测试..."
    - npm test || echo "⚠️ 测试跳过（生产环境）"

# ============================================
# Stage 4: 部署到服务器
# ============================================
deploy_to_server:
  stage: deploy
  needs:
    - run_tests
  image: alpine:latest
  before_script:
    - 'which ssh-agent || apk add --no-cache openssh-client'
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $SERVER_HOST >> ~/.ssh/known_hosts
  script:
    - echo "🚀 开始部署到服务器..."
    - echo "📍 服务器: $SERVER_HOST"
    - echo "📂 部署路径: $SERVER_PATH"
    - echo "🏷️ 发布版本: $CI_COMMIT_TAG"

    # 1. 创建远程目录
    - ssh $SERVER_USER@$SERVER_HOST "mkdir -p $SERVER_PATH"

    # 2. 同步代码（排除 node_modules 和敏感文件）
    - rsync -avz --delete
      --exclude='node_modules'
      --exclude='.git'
      --exclude='.env'
      --exclude='*.log'
      --exclude='logs/'
      --exclude='.DS_Store'
      dist/ $SERVER_USER@$SERVER_HOST:$SERVER_PATH/

    # 3. 同步 node_modules 和配置文件
    - rsync -avz
      node_modules/ package.json package-lock.json prisma/
      $SERVER_USER@$SERVER_HOST:$SERVER_PATH/

    # 4. 安装依赖（生产环境）
    - ssh $SERVER_USER@$SERVER_HOST "cd $SERVER_PATH && npm ci --only=production --prefer-offline"

    # 5. 数据库迁移
    - ssh $SERVER_USER@$SERVER_HOST "cd $SERVER_PATH && npx prisma migrate deploy || echo '⚠️ 迁移跳过'"

    # 6. 重启 PM2 服务
    - ssh $SERVER_USER@$SERVER_HOST "cd $SERVER_PATH && pm2 delete $APP_NAME 2>/dev/null || true"
    - ssh $SERVER_USER@$SERVER_HOST "cd $SERVER_PATH && pm2 start dist/app.js --name $APP_NAME --max-memory-restart 500M --env production"
    - ssh $SERVER_USER@$SERVER_HOST "pm2 save"

    # 7. 检查服务状态
    - ssh $SERVER_USER@$SERVER_HOST "pm2 status"
    - ssh $SERVER_USER@$SERVER_HOST "curl -s http://localhost:3000/health"

    - echo "✅ 部署完成！版本: $CI_COMMIT_TAG"
  after_script:
    - eval $(ssh-agent -k)
  when: manual  # 可选：改为 automatic 则自动部署

# ============================================
# 通知（可选）
# ============================================
notify_success:
  stage: deploy
  needs:
    - deploy_to_server
  script:
    - echo "🎉 部署成功！"
    - echo "🌐 访问地址: https://api.chancore.cn"
  when: on_success
