name: Yunce Dashboard CI

# 触发约定（仓库根 = yunce-back）：
# - 日常 push main：不跑
# - 打 dashboard-ci-*：只跑质量门禁（不部署）
# - 发版用 dashboard-v*：走 dashboard-release.yml
on:
  push:
    tags:
      - 'dashboard-ci-*'
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true
  TZ: Asia/Shanghai

jobs:
  quality:
    name: verify:sop + docker
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: yunce-admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: pnpm
          cache-dependency-path: yunce-admin/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: verify:sop
        run: pnpm run verify:sop

      - name: Docker build test
        run: >
          docker build -f scripts/deploy/Dockerfile
          --build-arg VITE_APP_STORE_SECURE_KEY=ci-docker-smoke-key-not-for-prod-32b
          -t yunce-dashboard:ci .
