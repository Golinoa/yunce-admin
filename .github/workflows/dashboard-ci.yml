name: Yunce Dashboard CI

# 触发约定（仓库根 = yunce-back）：
# - 日常 push master/main：不跑
# - 打 dashboard-ci-*：只跑质量门禁（不部署）
# - 发版用 dashboard-v*：走 dashboard-release.yml（单条 CI/CD，不重复跑本 workflow）
on:
  push:
    tags:
      - 'dashboard-ci-*'
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true
  TZ: Asia/Shanghai

jobs:
  quality:
    name: typecheck + lint + build + docker
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: yunce-admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: yunce-admin/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck web-antd
        run: pnpm --filter @vben/web-antd run typecheck

      - name: Lint (vsh)
        run: pnpm run lint
        continue-on-error: false

      - name: Build web-antd
        run: pnpm run build:antd

      - name: Docker build test
        run: docker build -f scripts/deploy/Dockerfile -t yunce-dashboard:ci .
